name: Validate LunaBot

on:
  push:
    branches: [main, research-paper-support]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests and deterministic benchmark
        run: npm test
      - name: Print benchmark summary
        if: always()
        run: |
          if [ -f benchmark-artifacts/benchmark-results.json ]; then
            cat benchmark-artifacts/benchmark-results.json
          else
            echo "Benchmark artifact was not generated."
          fi
      - name: Upload benchmark results
        if: always() && hashFiles('benchmark-artifacts/benchmark-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lunabot-benchmark-results
          path: benchmark-artifacts/benchmark-results.json
          if-no-files-found: error
      - name: Check production build
        run: npm run build
